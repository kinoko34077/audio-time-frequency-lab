name: Validate and publish imported Frequency Warp realtime Audio Lab

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: time-frequency-lab-pages-${{ github.ref }}
  cancel-in-progress: false

jobs:
  verify:
    name: Real browser, Rust/WASM and model regression
    # Playwright 1.56.0 Chromium does not support ubuntu26.04 runners.
    runs-on: ubuntu-24.04
    timeout-minutes: 28
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Regression for legacy models, live independent factors and asset graph
        run: |
          node --test web-demo/source-recorded-quality.test.mjs tests/*.test.mjs web-demo/lab-contract.test.mjs web-demo/source-timeline.test.mjs web-demo/player-display-clock.test.mjs web-demo/source-pcm-renderer.test.mjs web-demo/source-pcm-protocol.test.mjs web-demo/source-granular.test.mjs web-demo/lab-stream.test.mjs web-demo/lab-phase.test.mjs web-demo/lab-quality-regression.test.mjs web-demo/lab-wsola-short.test.mjs web-demo/period-joint.test.mjs web-demo/period-joint-integration.test.mjs web-demo/period-joint-multi.test.mjs web-demo/period-joint-close.test.mjs web-demo/period-joint-onset.test.mjs web-demo/period-joint-cycles.test.mjs web-demo/period-joint-combination.test.mjs web-demo/period-joint-precision.test.mjs web-demo/short256-transient.test.mjs web-demo/lab-timeline-audit.test.mjs web-demo/stage-pages.test.mjs
      - name: Compile imported upstream Rust DSP to WASM
        run: |
          rustup target add wasm32-unknown-unknown
          cargo build --manifest-path upstream/frequency-warp-vst/core/Cargo.toml --release --target wasm32-unknown-unknown
      - name: Stage exact inherited entry graph with new model overlay
        run: |
          node web-demo/stage-pages.mjs upstream/frequency-warp-vst/core/target/wasm32-unknown-unknown/release/frequency_warp_core.wasm
          test -s _site/index.html
          test -s _site/dsp_core.wasm
          test -s _site/realtime.worklet.js
          test -s _site/lab-dsp.mjs
          test -s _site/period-joint-multi.mjs
          test -s _site/period-joint-close.mjs
          test -s _site/lab-processor.worker.mjs
          test -s _site/lab-contract.mjs
      - name: Source-equivalent native Chrome AudioWorklet browser runtime
        run: |
          npm install --no-save --no-package-lock puppeteer-core@24
          command -v google-chrome
      - name: Install Japanese glyphs for actual UI screenshot review
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq fonts-noto-cjk
          fc-match 'Noto Sans CJK JP'
      - name: Native Chrome real Rust AudioWorklet with Lab live factors
        run: |
          WARP_WEB_ROOT=_site node --test web-demo/lab-live-smoke.test.mjs
      - name: Native Chrome AudioWorklet raw PCM and short-loop smoke (R2 staging)
        run: |
          node --test web-demo/source-pcm-worklet.browser.test.mjs
      - name: Native Chrome real-page raw PCM opt-in and seek without node restart
        run: |
          node --test web-demo/source-pcm-player.browser.test.mjs
      - name: Native Chrome recorded CC0 upright piano file-to-R3 Worklet (real recording)
        run: |
          node --test web-demo/source-recorded-player.browser.test.mjs
      - name: Fetch complete CC0 stereo orchestral music (test-only, not published)
        run: |
          set -euo pipefail
          curl --fail --location --silent --show-error --retry 3 --retry-delay 3 --connect-timeout 20 --max-time 180             --user-agent 'Mozilla/5.0'             'https://opengameart.org/sites/default/files/determined_pursuit_loop.wav'             --output web-demo/test-fixtures/determined-pursuit-cc0-full-stereo.wav
          test "$(stat -c%s web-demo/test-fixtures/determined-pursuit-cc0-full-stereo.wav)" -gt 4000000
          printf '%s  %s\n' 'e4f3be098b50213b56a60aefe60fffae79cd9f7c9008088f93c187ef1bbc856b' 'web-demo/test-fixtures/determined-pursuit-cc0-full-stereo.wav' | sha256sum -c
          file web-demo/test-fixtures/determined-pursuit-cc0-full-stereo.wav
      - name: Native Chrome COMPLETE real stereo orchestral song, musical sections, L-R fidelity and mobile player (R2)
        run: |
          node --test web-demo/source-stereo-music.browser.test.mjs
      - name: Native Chrome realtime graph capacity and recorded ultrashort output PCM (R2)
        run: |
          node --test web-demo/source-recorded-worklet-capacity.browser.test.mjs
      - name: Native Chrome R4 playback-first real-file and A/B/tab-state regression
        run: |
          node --test web-demo/player-first.browser.test.mjs
      - name: Native Chrome main-player recorded sound output and gesture integration (R2/R3)
        run: |
          node --test web-demo/player-output-integration.browser.test.mjs
      - name: Native Chrome UI visual audit with desktop and mobile screenshots
        if: always()
        run: |
          node --test web-demo/player-visual.browser.test.mjs
      - name: Cross-viewport Chrome gesture and UX audit (320px to desktop incl Android-size)
        if: always()
        run: |
          node --test web-demo/player-cross-viewport.browser.test.mjs
      - name: Preserve UI screenshots for human visual review
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: audio-lab-ui-review-${{ github.run_number }}
          path: ui-review-screenshots/*.png
          if-no-files-found: warn
          retention-days: 14
      - name: Native Chrome opt-in granular controls with precise signed speed and pitch (R3)
        run: |
          node --test web-demo/source-granular-player.browser.test.mjs
      - name: Native Chrome post-render PCM stress evidence (R2, not gapless acceptance)
        run: |
          node --test web-demo/source-pcm-stress.browser.test.mjs
      - name: Browser tooling (test runtime only)
        run: |
          python3 -m pip install --user playwright==1.56.0
          python3 -m playwright install --with-deps chromium
      - name: Inherited native file picker, Rust streaming and model overlay
        run: |
          python3 -m http.server 8123 --bind 127.0.0.1 --directory _site > /tmp/audio-lab-source-server.log 2>&1 &
          python3 tests/upstream_overlay_smoke.py
      - name: Full-length stereo auto-preview across all models
        run: |
          LAB_TEST_ORIGIN=http://127.0.0.1:8123/ python3 tests/long_model_smoke.py
      - name: Legacy lab regression stays available in repository
        run: |
          python3 -m http.server 8124 --bind 127.0.0.1 --directory . > /tmp/audio-lab-legacy-server.log 2>&1 &
          LAB_TEST_ORIGIN=http://127.0.0.1:8124/ python3 tests/browser_smoke.py
      - name: Upload tested inherited realtime site
        if: github.event_name != 'pull_request'
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  deploy:
    name: Publish native realtime audio Lab
    if: github.event_name != 'pull_request'
    needs: verify
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/configure-pages@v5
      - id: deployment
        uses: actions/deploy-pages@v4
      - name: Verify public inherited Rust app and model assets
        env:
          PAGE_URL: ${{ steps.deployment.outputs.page_url }}
        run: |
          set -eu
          base="${PAGE_URL%/}"
          for asset in index.html style.css app.mjs dsp.mjs dsp_core.wasm realtime.worklet.js lab-dsp.mjs lab-contract.mjs lab-processor.worker.mjs period-joint.mjs period-joint-multi.mjs period-joint-close.mjs; do
            curl --fail --silent --show-error --location --retry 8 --retry-delay 3 --retry-all-errors "$base/$asset" -o "/tmp/$asset"
            test -s "/tmp/$asset"
          done
          grep -q 'lab-model' /tmp/index.html
          grep -q 'frequency-warp-rust' /tmp/realtime.worklet.js
          echo 'PASS public inherited Rust/WASM AudioWorklet and model overlay assets.'
